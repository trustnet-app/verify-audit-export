name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: gofmt + vet + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: build CLI
        run: go build ./cmd/trustnet-verify
